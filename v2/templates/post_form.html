{% extends "base.html" %}{% block content %}<div class="page-title"><div><p class="eyebrow">PLANEJAMENTO EDITORIAL</p><h1>{{ heading }}</h1><p>Prepare o conteúdo antes de publicar manualmente nas redes.</p></div></div><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Produto<select name="product_id"><option value="">Sem produto associado</option>{% for item in products %}<option value="{{ item.id }}" {% if default_product and default_product|string==item.id|string %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label><div class="form-grid"><label>Data planejada<input type="date" name="planned_date" value="{{ p.planned_date if p else today }}"></label><label>Formato<select name="format">{% for f in formats %}<option {% if (p.format if p else 'Story')==f %}selected{% endif %}>{{ f }}</option>{% endfor %}</select></label><label>Status<select name="status">{% for s in statuses %}<option {% if (p.status if p else 'Ideia')==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label></div><label>Legenda<textarea name="caption" rows="5" placeholder="Escreva a legenda da publicação…">{{ p.caption if p else '' }}</textarea></label><label>Hashtags<textarea name="hashtags" rows="3" placeholder="#shopee #ofertas">{{ p.hashtags if p else '' }}</textarea></label><label>Chamada para ação<input name="cta" value="{{ p.cta if p else 'Esse e muitos outros no link no perfil' }}" placeholder="Ex.: Confira no link do perfil"></label><label>Observações<textarea name="notes" rows="3">{{ p.notes if p else '' }}</textarea></label><div class="form-actions"><button class="btn primary" type="submit">Salvar planejamento</button><a class="btn ghost" href="{{ url_for('posts') }}">Cancelar</a></div></form>{% endblock %}
